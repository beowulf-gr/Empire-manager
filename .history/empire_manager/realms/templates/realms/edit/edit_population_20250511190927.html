<!DOCTYPE html>
<html>
<head><title>Edit Population</title>
    {% load static %}
    <link rel="stylesheet" type="text/css" href="{% static 'css/form_style.css' %}">
</head>
<body>
    <h1>Edit Population</h1>
    {% load static %}
    <script>
        const addBtn = document.getElementById("add-form-btn");
        const container = document.getElementById("formset-container");
        const totalForms = document.getElementById("id_form-TOTAL_FORMS");

        addBtn.addEventListener("click", function () {
            const currentFormCount = parseInt(totalForms.value);
            const newFormHtml = container.children[0].outerHTML.replace(/form-(\d)-/g, `form-${currentFormCount}-`);
            container.insertAdjacentHTML('beforeend', newFormHtml);
            totalForms.value = currentFormCount + 1;
        });
    </script>

    <form method="POST">
        {% csrf_token %}
        {{ formset.management_form }}
        {% for form in formset %}
            <div class="unit-form">
                {{ form.as_p }}
            </div>
        {% endfor %}
        <button type="button" id="add-form-btn">Add More</button>
        <button type="submit">Save Changes</button>
    </form>

    <p><a href="{% url 'create_realm_review' %}?realm_name={{ realm.name }}">Back to Review</a></p>

</body>
</html>

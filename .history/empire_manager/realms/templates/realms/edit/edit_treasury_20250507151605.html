<!DOCTYPE html>
<html>
<head><title>Edit Treasury</title>
    {% load static %}
    <link rel="stylesheet" type="text/css" href="{% static 'css/form_style.css' %}">
</head>
<body>
    <h1>Edit Treasury</h1>
    <form method="POST">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">Save Treasury</button>
    </form>

    <p><a href="{% url 'create_realm_review' %}?realm_name={{ realm.name }}">Back to Review</a></p>

    <h3>Edit Other Steps:</h3>
    <ul>
        <li><a href="{% url 'edit_realm_info' %}">Edit Realm Info</a></li>
        <li><a href="{% url 'edit_resources' %}">Edit Resources</a></li>
        <li><a href="{% url 'edit_land' %}">Edit Land</a></li>
        <li><a href="{% url 'edit_population' %}">Edit Population</a></li>
    </ul>
</body>
</html>

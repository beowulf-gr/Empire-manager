<!DOCTYPE html>
<html>
<head><title>Edit Resources</title>
    {% load static %}
    <link rel="stylesheet" type="text/css" href="{% static 'css/form_style.css' %}">
</head>
<body>
    <h1>Edit Resources</h1>

    <form method="POST">

    <p><a href="{% url 'create_realm_review' %}?realm_name={{ realm.name }}">Back to Review</a></p>

</body>
</html>

<!DOCTYPE html>
<html>
<head><title>Edit Population</title>
    {% load static %}
    <link rel="stylesheet" type="text/css" href="{% static 'css/form_style.css' %}">
</head>
<body>
    <h1>Edit Population</h1>

    <form method="POST">
        {% csrf_token %}
        {{ formset.management_form }}
        <p>Initial: {{ formset.initial }}</p>
        {% for form in formset %}
            <div class="unit-form">
                {{ form.as_p }}
            </div>
        {% endfor %}
        <button type="submit">Save Changes</button>
    </form>

    <p><a href="{% url 'create_realm_review' %}?realm_name={{ realm.name }}">Back to Review</a></p>

</body>
</html>

<!DOCTYPE html>
<html>
<head>
    <title>Create a Realm</title>
</head>
<body>
    <h1>Create a New Realm</h1>
    {% if messages %}
    <ul style="color: red;">
        {% for message in messages %}
            <li>{{ message }}</li>
        {% endfor %}
    </ul>
    {% endif %}
    <form method="POST">
        {% csrf_token %}
        <label for="name">Realm Name:</label>
        <input type="text" id="name" name="name" required>
        <br>
        <label for="ruler">Ruler Name:</label>
        <input type="text" id="ruler" name="ruler" required>
        <br>
        <button type="submit">Create Realm</button>
    </form>
</body>
</html>

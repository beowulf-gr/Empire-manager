<!DOCTYPE html>
<html>
<head><title>Step 4 - Land</title>
    <style>
        /* Enforce block display for form elements */
        form {
            display: block;
        }

        label, select, input, button {
            display: block;      /* Make sure each element takes full width and is stacked */
            margin-bottom: 15px; /* Add spacing between elements */
        }

        button {
            width: 200px;        /* Set a fixed width for buttons if needed */
        }
    </style></head>
<body>
    <h1>Step 4: Assign Starting Land</h1>
    <form method="POST">
        {% csrf_token %}
        <label>Name:</label>
            {{ form.name }}

        <label for="unit_type">Land Type:</label>
            {{ form.unit_type }}

        <button type="submit" name="next" value="1">Next</button>
        <button type="submit">Add Another</button>
    </form>
    
    <a href="{% url 'create_realm_step_3' %}">Back</a>
</body>
</html>

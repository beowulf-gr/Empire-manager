<!DOCTYPE html>
<html>
<head>
    <title>Step 4 - Land</title>
</head>
<body>
    <h1>Step 4: Assign Starting Land</h1>
    <form method="POST">
        {% csrf_token %}

        <label for="name">Name:</label>
        {{ form.name }}  <!-- Django form field will render here -->

        <label for="unit_type">Land Type:</label>
        {{ form.unit_type }}  <!-- Django form field will render here -->

        <button type="submit" name="next" value="1">Next</button>
        <button type="submit">Add Another</button>
    </form>

    <a href="{% url 'create_realm_step_3' %}">Back</a>
</body>
</html>
